<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шаблоны приглашений</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--ink:#2b2b30;--muted:#77736b;--card:#fffdf9;--line:#e3ddd1}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17171a;--ink:#efece6;--muted:#a19d95;--card:#222226;--line:#34343a}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;padding:40px 16px 60px}
h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:56px;text-align:center;line-height:1.1}
.sub{text-align:center;color:var(--muted);font-size:19px;margin:8px auto 36px;max-width:600px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;max-width:1180px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-decoration:none}
.shots img{width:100%;aspect-ratio:390/844;object-fit:cover;border-radius:12px;display:block;background:#ddd;transition:transform .25s}
.shots:hover img{transform:translateY(-3px)}
.card h2{font-size:28px;font-weight:600;margin:14px 4px 2px}
.card p{font-size:17px;color:var(--muted);margin:0 4px 10px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 14px}
.tags span{font-size:13px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 4px 4px}
.open{font-size:15px;letter-spacing:.14em;text-transform:uppercase;border:1px solid currentColor;border-radius:30px;padding:9px 20px;color:inherit;text-decoration:none}
.dots{display:flex;gap:6px}
.dots a{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
</style></head>
<body>
<h1>Выберите шаблон</h1>
<p class="sub">Четыре разных шаблона: у каждого своё открытие, своя подача и свой стиль. Данные во всех шаблонах общие, поэтому меняются в одном месте.</p>
<div class="grid" id="grid"></div>
<script>
const T=[
 {href:'./',img:'blue',t:'Конверт',d:'Классика жанра: конверт с сургучной печатью и золотыми искрами, цветы, прокрутка вниз.',tags:['конверт','цветы','4 цвета'],
  colors:[['blue','#2f4ea8'],['pudra','#b0606f'],['emerald','#1f5c47'],['classic','#1e1e22']]},
 {href:'yurt/',img:'yurt',t:'Боз үй',d:'Национальный стиль: гость «открывает» түндүк юрты и видит небо, дальше идут шырдак-орнаменты и кочкор мүйүз.',tags:['кыргызский стиль','түндүк','орнамент']},
 {href:'stories/',img:'stories',t:'Сторис',d:'Как сторис в Instagram: полноэкранные слайды с полосками прогресса, листаются касанием, удержание ставит на паузу.',tags:['слайды','современный','фото на фоне']},
 {href:'journal/',img:'journal',t:'Журнал',d:'Минимализм в духе модного журнала: занавес с именами, крупная типографика, место под фото пары, бегущая строка.',tags:['минимализм','фото пары','чёрно-белый']}];
document.getElementById('grid').innerHTML=T.map(x=>`<div class="card">
 <a class="shots" href="${x.href}"><img src="thumbs/${x.img}_1.jpg" alt="${x.t}: открытие" loading="lazy"><img src="thumbs/${x.img}_2.jpg" alt="${x.t}: внутри" loading="lazy"></a>
 <h2>${x.t}</h2><p>${x.d}</p><div class="tags">${x.tags.map(s=>`<span>${s}</span>`).join('')}</div>
 <div class="row"><a class="open" href="${x.href}">Открыть</a>${x.colors?`<div class="dots">${x.colors.map(([k,c])=>`<a href="./?theme=${k}" title="${k}" style="background:${c}"></a>`).join('')}</div>`:''}</div></div>`).join('');
</script>
</body></html>
